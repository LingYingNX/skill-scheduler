<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Skill调度器</title>
  <link rel="icon" type="image/svg+xml" href="./app-icon.svg">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06A1.7 1.7 0 0 0 15.74 19a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-3v-.3a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.88.34l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 6.58 15.4a1.7 1.7 0 0 0-1.6-1.1H4.7v-3h.28a1.7 1.7 0 0 0 1.6-1.1A1.7 1.7 0 0 0 6.24 8.3L6.18 8.2l2.12-2.12.06.06A1.7 1.7 0 0 0 10.24 6.5a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V4.5h3v.3a1.7 1.7 0 0 0 1.1 1.6 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.6 1.1h.3v3h-.3A1.7 1.7 0 0 0 19.4 15Z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M5 3h14l-2 8 3 3H4l3-3-2-8Z"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-square" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-languages" viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 9c1.6 1.8 3.3 3.1 5.2 4M11.2 9c-1.5 2.2-3.4 4.1-5.7 5.7M13 19l4-9 4 9M14.5 16h5"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.3 4.2 2.8 18a2 2 0 0 0 1.8 3h14.8a2 2 0 0 0 1.8-3L13.7 4.2a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.7M20 4v7h-7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 1024 1024"><path fill="currentColor" stroke="none" d="M512 0c282.7776 0 512 229.2224 512 512s-229.2224 512-512 512S0 794.7776 0 512 229.2224 0 512 0z m0 76.8C271.6416 76.8 76.8 271.6416 76.8 512s194.8416 435.2 435.2 435.2 435.2-194.8416 435.2-435.2S752.3584 76.8 512 76.8z"/><path fill="currentColor" stroke="none" d="M312.8832 312.8832a38.4 38.4 0 0 1 54.2976 0L512 457.6768l144.8448-144.7936a38.4 38.4 0 0 1 54.2976 54.2976L566.2976 512l144.8192 144.8448a38.4 38.4 0 0 1-54.2976 54.2976l-144.8448-144.8192-144.7936 144.8192a38.4 38.4 0 0 1-54.2976-54.2976l144.7936-144.8448-144.7936-144.7936a38.4 38.4 0 0 1 0-54.2976z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  </svg>

  <div class="app-shell">
    <div class="resize-handle resize-top" data-resize="top"></div>
    <div class="resize-handle resize-right" data-resize="right"></div>
    <div class="resize-handle resize-bottom" data-resize="bottom"></div>
    <div class="resize-handle resize-left" data-resize="left"></div>
    <div class="resize-handle resize-top-left" data-resize="top-left"></div>
    <div class="resize-handle resize-top-right" data-resize="top-right"></div>
    <div class="resize-handle resize-bottom-left" data-resize="bottom-left"></div>
    <div class="resize-handle resize-bottom-right" data-resize="bottom-right"></div>
    <header class="titlebar" data-window-drag>
      <div class="brand">
        <img class="brand-mark" src="./app-icon.svg" alt="">
        <span class="brand-title">Skill调度器</span>
        <span class="brand-subtitle">Codex Skills</span>
      </div>
      <div class="window-controls">
        <button type="button" data-command="window.pin" title="置顶" aria-label="置顶">
          <svg><use href="#i-pin"></use></svg>
        </button>
        <button type="button" data-command="window.minimize" title="最小化" aria-label="最小化">
          <svg><use href="#i-minus"></use></svg>
        </button>
        <button type="button" data-command="window.toggleMaximize" title="最大化" aria-label="最大化">
          <svg><use href="#i-square"></use></svg>
        </button>
        <button type="button" class="close-button" data-command="window.close" title="关闭" aria-label="关闭">
          <svg><use href="#i-x"></use></svg>
        </button>
      </div>
    </header>

    <main id="app-main" class="app-main">
      <section id="catalog-view" class="view catalog-view" aria-label="Skills">
        <div class="toolbar">
          <label class="search-box" for="search-input">
            <svg class="search-icon"><use href="#i-search"></use></svg>
            <input id="search-input" type="search" autocomplete="off" spellcheck="false"
                   placeholder="搜索命令或描述">
            <button id="clear-search" class="icon-button clear-search" type="button" title="清空搜索" aria-label="清空搜索" hidden>
              <svg><use href="#i-x"></use></svg>
            </button>
          </label>
          <button id="translate-all" class="toolbar-button" type="button" title="翻译已有描述">
            <svg><use href="#i-languages"></use></svg>
            <span>翻译</span>
          </button>
          <button id="theme-toggle" class="theme-switch" type="button" role="switch"
                  aria-checked="false" aria-label="切换深色主题" title="切换主题">
            <span class="theme-switch-track">
              <svg class="theme-switch-sun"><use href="#i-sun"></use></svg>
              <svg class="theme-switch-moon"><use href="#i-moon"></use></svg>
              <span class="theme-switch-thumb"></span>
            </span>
          </button>
          <button id="open-settings" class="icon-button settings-button" type="button" title="设置" aria-label="设置">
            <svg><use href="#i-settings"></use></svg>
          </button>
        </div>

        <div id="warning-banner" class="warning-banner" hidden>
          <svg><use href="#i-alert"></use></svg>
          <span id="warning-text"></span>
        </div>

        <div class="catalog-meta">
          <div class="status-copy">
            <span id="skill-count" class="skill-count">正在载入</span>
            <span id="root-status" class="root-status"></span>
          </div>
          <button id="collapse-all" class="text-button" type="button">折叠全部</button>
        </div>

        <div id="catalog-scroll" class="catalog-scroll">
          <div id="loading-state" class="loading-state" aria-live="polite">
            <span class="loading-indicator" aria-hidden="true"></span>
            <span>正在扫描 Skills</span>
          </div>
          <div id="category-list" class="category-list" aria-live="polite"></div>
          <div id="empty-state" class="empty-state" hidden>
            <svg><use href="#i-search"></use></svg>
            <strong id="empty-title">没有匹配的 Skills</strong>
            <span id="empty-description">尝试缩短关键词。</span>
          </div>
        </div>

        <footer class="statusbar">
          <span id="footer-status">config.json 已同步</span>
          <span class="statusbar-hint"><kbd>Ctrl</kbd><kbd>K</kbd> 搜索</span>
        </footer>
      </section>

      <section id="settings-view" class="view settings-view" aria-label="设置" hidden>
        <header class="settings-header">
          <button id="close-settings" class="icon-button" type="button" title="返回" aria-label="返回">
            <svg><use href="#i-back"></use></svg>
          </button>
          <h1>设置</h1>
          <span class="settings-spacer"></span>
        </header>
        <div class="segment-control" role="tablist" aria-label="设置分类">
          <button id="tab-paths" class="segment active" type="button" role="tab" aria-selected="true">Skills 路径</button>
          <button id="tab-api" class="segment" type="button" role="tab" aria-selected="false">模型与翻译</button>
        </div>

        <div class="settings-scroll">
          <section id="paths-panel" class="settings-panel" role="tabpanel">
            <div class="section-heading">
              <span>已监控路径</span>
              <span id="paths-count" class="muted-text">0</span>
            </div>
            <div id="paths-list" class="path-list"></div>
            <form id="add-path-form" class="add-path-form">
              <input id="path-input" type="text" autocomplete="off" spellcheck="false"
                     placeholder="输入 Skills 文件夹路径">
              <button id="browse-path" class="secondary-button" type="button" title="浏览文件夹">
                <svg><use href="#i-folder"></use></svg>
              </button>
              <button class="primary-button" type="submit">添加</button>
            </form>
          </section>

          <section id="api-panel" class="settings-panel" role="tabpanel" hidden>
            <div class="section-heading">
              <span>模型供应商</span>
              <button id="add-provider-button" class="text-button provider-add-button" type="button"
                      aria-haspopup="dialog" aria-controls="provider-dialog">
                <svg><use href="#i-plus"></use></svg>
                <span>添加供应商</span>
              </button>
            </div>
            <div id="provider-list" class="provider-list"></div>
          </section>
        </div>

      </section>
    </main>

    <div id="context-menu" class="context-menu" role="menu" hidden>
      <div class="context-label">移动到分类</div>
      <div id="context-category-actions"></div>
      <div class="context-separator"></div>
      <button id="retranslate-skill" type="button" role="menuitem" hidden>
        <svg><use href="#i-languages"></use></svg><span>重新翻译</span>
      </button>
    </div>

    <dialog id="provider-dialog" class="provider-dialog">
      <header class="provider-dialog-header">
        <div>
          <h2>添加供应商</h2>
          <p>选择平台预设，或添加自定义接口。</p>
        </div>
        <button id="close-provider-dialog" class="icon-button" type="button"
                title="关闭" aria-label="关闭">
          <svg><use href="#i-x"></use></svg>
        </button>
      </header>
      <div id="provider-preset-list" class="provider-preset-list"></div>
    </dialog>

    <dialog id="category-delete-dialog" class="provider-dialog confirm-dialog">
      <header class="provider-dialog-header">
        <div>
          <h2>删除分类</h2>
          <p id="category-delete-message"></p>
        </div>
      </header>
      <div class="confirm-actions">
        <button id="cancel-delete-category" class="secondary-button" type="button">取消</button>
        <button id="confirm-delete-category" class="danger-button" type="button">删除</button>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite">
      <span class="toast-dot"></span>
      <span id="toast-text"></span>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
