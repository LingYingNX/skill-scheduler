<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none" style="--glow-color: rgba(6, 182, 212, 0.45);">
  <defs>
    <!-- 底座渐变 -->
    <linearGradient id="plateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="plateBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9" />
    </linearGradient>

    <!-- 技能芯片与组件渐变 -->
    <linearGradient id="primaryFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentFlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <linearGradient id="coreFacet" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6" />
    </linearGradient>

    <!-- 辉光滤镜 (可选) -->
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>


  <!-- 背景圆角底座 (App Icon Plate) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#plateBg)" stroke="url(#plateBorder)" stroke-width="3" />
  <!-- 底座科技网格与深空景深光 -->
  <circle cx="256" cy="256" r="180" fill="#06b6d4" opacity="0.06" filter="url(#neonBloom)" />


  <!-- 调度器外围轨道环 (Dispatch Orbit Track) -->
  <g class="pulse-ring" style="transform-origin: 256px 256px; transition: all 0.4s ease;">
    <circle cx="256" cy="256" r="172" stroke="#06b6d4" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="8 6" />
    <circle cx="256" cy="256" r="144" stroke="#6366f1" stroke-opacity="0.25" stroke-width="1.5" />
  </g>

  <!-- 辐射状技能调用信道 (Dispatch Ray Channels) -->
  <g stroke-linecap="round" opacity="0.6">
    <!-- 通道 1: 向上左分发 (Invoke Ray A) -->
    <path d="M256 256 L150 148" stroke="url(#primaryFlow)" stroke-width="3.5" stroke-dasharray="160" stroke-dashoffset="10" />
    <!-- 通道 2: 向上右分发 (Invoke Ray B) -->
    <path d="M256 256 L362 148" stroke="url(#accentFlow)" stroke-width="3.5" stroke-dasharray="160" stroke-dashoffset="10" />
    <!-- 通道 3: 向下分发 (Invoke Ray C) -->
    <path d="M256 256 L256 396" stroke="url(#primaryFlow)" stroke-width="3.5" stroke-dasharray="160" stroke-dashoffset="10" />
  </g>

  <!-- 动态技能模块单元群 (Skill Units Cluster) -->
  <g filter="url(#neonBloom)">

    <!-- 技能 1: 决策与逻辑插件 (Skill Module Alpha - Top Left) -->
    <g class="skill-chip chip-1" style="transform-origin: 150px 148px;">
      <!-- 外框菱形芯片 -->
      <polygon points="150,96 196,148 150,200 104,148" fill="#030712" stroke="#06b6d4" stroke-width="3.5" stroke-linejoin="round" />
      <!-- 芯片内核刻线 -->
      <polygon points="150,116 178,148 150,180 122,148" fill="url(#primaryFlow)" fill-opacity="0.35" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="150" cy="148" r="4.5" fill="#ffffff" />
      <!-- 信号连接端点 -->
      <circle cx="104" cy="148" r="3.5" fill="#06b6d4" />
      <circle cx="196" cy="148" r="3.5" fill="#6366f1" />
    </g>

    <!-- 技能 2: 执行与生成插件 (Skill Module Beta - Top Right) -->
    <g class="skill-chip chip-2" style="transform-origin: 362px 148px;">
      <polygon points="362,96 408,148 362,200 316,148" fill="#030712" stroke="#d946ef" stroke-width="3.5" stroke-linejoin="round" />
      <polygon points="362,116 390,148 362,180 334,148" fill="url(#accentFlow)" fill-opacity="0.35" stroke="#d946ef" stroke-width="1.5" />
      <circle cx="362" cy="148" r="4.5" fill="#ffffff" />
      <circle cx="316" cy="148" r="3.5" fill="#6366f1" />
      <circle cx="408" cy="148" r="3.5" fill="#d946ef" />
    </g>

    <!-- 技能 3: 记忆与工具检索插件 (Skill Module Gamma - Bottom Center) -->
    <g class="skill-chip chip-3" style="transform-origin: 256px 396px;">
      <polygon points="256,344 302,396 256,448 210,396" fill="#030712" stroke="#06b6d4" stroke-width="3.5" stroke-linejoin="round" />
      <polygon points="256,364 284,396 256,428 228,396" fill="url(#primaryFlow)" fill-opacity="0.35" stroke="#06b6d4" stroke-width="1.5" />
      <circle cx="256" cy="396" r="4.5" fill="#ffffff" />
      <circle cx="210" cy="396" r="3.5" fill="#6366f1" />
      <circle cx="302" cy="396" r="3.5" fill="#06b6d4" />
    </g>

  </g>

  <!-- 调度核心中枢 (Central Dispatcher Hub) -->
  <g class="glow-core" filter="url(#neonBloom)">

    <!-- 中枢外围护盾六边形 -->
    <polygon points="256,192 312,224 312,288 256,320 200,288 200,224"
             fill="#030712"
             stroke="url(#primaryFlow)"
             stroke-width="4.5"
             stroke-linejoin="round" />

    <!-- 中枢内层能量晶体 (Core Facet) -->
    <polygon points="256,208 298,232 298,280 256,304 214,280 214,232"
             fill="url(#coreFacet)"
             stroke="#ffffff"
             stroke-width="1.5"
             stroke-linejoin="round" />

    <!-- 核心微架构：立体棱线 (Isometric Lines) -->
    <path d="M256 208 L256 304" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
    <path d="M256 256 L298 232" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
    <path d="M256 256 L214 232" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8" />
    <path d="M256 256 L298 280" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M256 256 L214 280" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- 调度原点高亮光斑 -->
    <circle cx="256" cy="256" r="6" fill="#ffffff" />
  </g>

  <!-- 动态调用数据跃迁光标 (Invocation Pulses) -->
  <g fill="#ffffff">
    <circle cx="198" cy="198" r="3" opacity="0.9" />
    <circle cx="314" cy="198" r="3" opacity="0.9" />
    <circle cx="256" cy="336" r="3.5" opacity="0.9" />
  </g>
</svg>